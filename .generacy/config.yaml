# Per-repo agent overrides read by cluster workers (orchestrator.agents runtime path).
# Phases not listed inherit `agents.default`. PR-feedback, validate-fix, and
# merge-conflict fixers resolve against the `implement` phase entry.
orchestrator:
  agents:
    default:
      provider: claude-code
      model: claude-fable-5
      effort: high
    workflows:
      speckit-feature:
        phases:
          plan:
            model: claude-fable-5
            effort: xhigh
          implement:
            model: claude-opus-5
            effort: high
      speckit-bugfix:
        phases:
          plan:
            model: claude-fable-5
            effort: xhigh
          implement:
            model: claude-opus-5
            effort: high
